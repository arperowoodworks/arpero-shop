<script>
const K='arperoShop1',TODAY=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const P=(n,c,due,ship,notes,cat)=>({id:Math.random().toString(36).slice(2),name:n,customer:c,due,ship,notes,pct:0,done:false,cat:cat||'job',maxPct:0,price:0,costs:[],paid:0,product:''});

P("Josh's bar table","Josh","2026-11-05","","Confirm exact date"),
P("Wheel caps","","","","Ram 2500 set, best-seller restock"),
P("Joann's coasters","Joann","","",""),P("Kevin's coasters","Kevin","","",""),P("Caroline's height board","Caroline","","",""),
...["Walnut Dining Chair","Cherry Wood Bookshelf","Walnut Coffee Table","White Oak Coffee Table"].map(n=>P(n,"","","","Waiting for order","shop"))]}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();S.log=S.log||[];
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const LV=[[0,'Apprentice'],[150,'Sawdust Sweeper'],[400,'Journeyman'],[800,'Joiner'],[1400,'Craftsman'],[2200,'Cabinetmaker'],[3200,'Master Woodworker'],[4500,'Grand Master of the Grain']];
const lvl=x=>{let i=0;LV.forEach((l,j)=>{if(x>=l[0])i=j});return i};
const days=d=>d?Math.round((new Date(d+'T00:00')-new Date(TODAY()+'T00:00'))/864e5):null;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bump(){const t=TODAY();if(S.last===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');S.streak=S.last===ys?S.streak+1:1;S.last=t}
function setPct(id,v){const p=S.projects.find(x=>x.id==id);v=Math.max(0,Math.min(100,+v));if(v>p.maxPct){S.xp+=v-p.maxPct;p.maxPct=v;bump()}p.pct=v;if(v===100&&!p.done)return finish(id);save();R()}
function finish(id){const p=S.projects.find(x=>x.id==id);if(p.maxPct<100){S.xp+=100-p.maxPct;p.maxPct=100}p.pct=100;p.done=true;p.doneOn=TODAY();let b=50;const dl=days(p.due);if(p.due&&dl>=0)b+=25;S.xp+=b;bump();save();R();party('+'+b+' XP bonus! '+p.name+' done 🎉')}
function party(msg){const c=['#ffd27a','#c98a3c','#9fd88a','#ff6b5b','#7ac6ff'];for(let i=0;i<70;i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

if(eid)Object.assign(S.projects.find(x=>x.id==eid),v);else S.projects.push(Object.assign(P(v.name,v.customer,v.due,v.ship,v.notes),{}));save();R()});
function del(id){if(confirm('Delete this project?')){S.projects=S.projects.filter(p=>p.id!=id);save();R()}}
function reopen(id){const p=S.projects.find(x=>x.id==id);p.done=false;p.pct=90;save();R()}

imp.onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.projects))throw 0;d.log=d.log||[];S=d;save();R();alert('Backup restored')}catch(x){alert('Not a valid backup file')}};r.readAsText(e.target.files[0])};

function payInfo(p){const pr=+p.price||0,pd=Math.min(+p.paid||0,Math.max(pr,+p.paid||0));const owed=Math.max(0,pr-pd);return{pr,pd,owed,st:!pr&&!pd?'':pd<=0?'Not paid':pd>=pr?'Paid':'Partly paid'}}
function payHTML(p){const i=payInfo(p);if(!i.st)return'';const c=i.st==='Paid'?'pd':i.st==='Not paid'?'np':'pp';
return `<div class="row" style="align-items:center;font-size:14px"><span class="st ${c}">${i.st}</span><span>Paid <b>${$$(i.pd)}</b> of ${$$(i.pr)}</span>${i.owed?`<span>Owed <b class="neg">${$$(i.owed)}</b></span><button onclick="fullPay('${p.id}')">✔ Mark fully paid</button>`:''}</div>`}
function fullPay(id){const p=S.projects.find(x=>x.id==id);p.paid=+p.price||0;save();R()}
// ---- Log ----
function addLog(t){const a=parseFloat(lAmt.value);if(!a){lAmt.focus();return}S.log=S.log||[];S.log.push({id:Math.random().toString(36).slice(2),type:t,amount:a,note:lNote.value.trim(),date:lDate.value||TODAY()});lAmt.value='';lNote.value='';save();R()}
function delLog(id){if(confirm('Delete this entry?')){S.log=S.log.filter(x=>x.id!=id);save();R()}}
function renderLog(){const L=(S.log||[]).slice().sort((a,b)=>a.date<b.date?-1:1);const row=x=>`<div class="le"><div>${$$(x.amount)}<small>${esc(x.note)} ${x.date.slice(5)}</small></div><button class="d" onclick="delLog('${x.id}')">✕</button></div>`;
const E=L.filter(x=>x.type==='exp'),I=L.filter(x=>x.type==='inc'),te=E.reduce((a,x)=>a+x.amount,0),ti=I.reduce((a,x)=>a+x.amount,0);
lExp.innerHTML=(E.map(row).join('')||'<div class="sub">None yet</div>')+`<div class="lsum">= ${$$(te)}</div>`;lInc.innerHTML=(I.map(row).join('')||'<div class="sub">None yet</div>')+`<div class="lsum">= ${$$(ti)}</div>`;
lNet.innerHTML=`<div class="top"><span>Log net (income − expenses)</span><b class="${ti-te<0?'neg':'pos'}">${$$(ti-te)}</b></div><div class="sub">Log entries are extra money not tied to a project. Project payments and costs are counted separately in the summary.</div>`;if(!lDate.value)lDate.value=TODAY();return{te,ti}}
function tab(t){vP.hidden=t!=='p';vL.hidden=t!=='l';tP.classList.toggle('on',t==='p');tL.classList.toggle('on',t==='l')}
// ---- Money (structure: p.price number, p.costs [{name,amount}]) ----
const COST_PRESETS=['Wood','Epoxy','Finish','Hardware','Shipping','Fees'];
const $$=n=>'$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function money(p){const c=(p.costs||[]).reduce((a,x)=>a+(+x.amount||0),0),r=+p.price||0;return{rev:r,cost:c,profit:r-c,margin:r?(r-c)/r*100:null}}
function moneyHTML(p){const m=money(p);if(!m.rev&&!m.cost)return '<div class="money"><span class="sub">No price or costs yet</span></div>';
return `<div class="money"><span>Price <b>${$$(m.rev)}</b></span><span>Cost <b>${$$(m.cost)}</b></span><span>Profit <b class="${m.profit<0?'neg':'pos'}">${$$(m.profit)}</b>${m.margin!==null?` (${Math.round(m.margin)}%)`:''}</span></div>`}
function totals(){let r=0,c=0,col=0,ow=0;S.projects.forEach(p=>{const m=money(p),i=payInfo(p);r+=m.rev;c+=m.cost;col+=i.pd;ow+=i.owed});const lg=renderLog(),inc=col+lg.ti,exp=c+lg.te,net=inc-exp;
totEl.innerHTML=`<div>Income<b>${$$(inc)}</b>collected</div><div>Expenses<b>${$$(exp)}</b>costs + log</div><div>Net<b class="${net<0?'neg':'pos'}">${$$(net)}</b>${inc?Math.round(net/inc*100)+'% margin':''}</div><div>Sales booked<b>${$$(r)}</b></div><div>Collected<b>${$$(col)}</b></div><div>Owed<b class="${ow?'neg':''}">${$$(ow)}</b></div>`}
let cid=null;
function ciRow(x){const d=document.createElement('div');d.className='ci';d.innerHTML=`<input class="nm" list="cpre" placeholder="Item" value="${esc(x.name)}"><input class="amt" type="number" step="0.01" inputmode="decimal" placeholder="$" value="${x.amount===''||x.amount==null?'':x.amount}"><button type="button" class="d" onclick="this.parentNode.remove();cprevU()">✕</button>`;d.oninput=cprevU;clist.appendChild(d)}
function addCI(){ciRow({name:'',amount:''})}
function readC(){return[...clist.children].map(d=>({name:d.querySelector('.nm').value.trim(),amount:parseFloat(d.querySelector('.amt').value)||0})).filter(x=>x.name||x.amount)}
function cprevU(){const m=money({price:cf.elements.price.value,costs:readC()});cprev.textContent=`Cost ${$$(m.cost)} · Profit ${$$(m.profit)}${m.margin!==null?' ('+Math.round(m.margin)+'%)':''}`}
function costs(id){cid=id;const p=S.projects.find(x=>x.id==id);cname.textContent=p.name;cf.elements.price.value=p.price||'';cf.elements.paid.value=p.paid||'';fillProd(p.product);clist.innerHTML='';
(p.costs&&p.costs.length?p.costs:COST_PRESETS.slice(0,3).map(n=>({name:n,amount:''}))).forEach(ciRow);cprevU();cdlg.showModal()}
cf.elements.price.oninput=cprevU;
cdlg.addEventListener('close',()=>{if(cdlg.returnValue!=='save')return;const p=S.projects.find(x=>x.id==cid);p.price=parseFloat(cf.elements.price.value)||0;p.paid=parseFloat(cf.elements.paid.value)||0;p.product=prodSel.value===''?'':PRODUCTS[prodSel.value][0];p.costs=readC();save();R()});
document.body.insertAdjacentHTML('beforeend','<datalist id="cpre">'+COST_PRESETS.map(n=>`<option value="${n}">`).join('')+'</datalist>');
R();if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');
</script></body></html>
